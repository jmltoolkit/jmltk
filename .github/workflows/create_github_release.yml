#    # Sequence of patterns matched against refs/tags
#    tags:
#      #      - 'v[0-9]+.[0-9]+.[0-9]+' # Push events to matching pattern -- updated to use regex for a semantic versioning version number
#      - 'javaparser-parent-[0-9].*' # Push events to matching pattern -- loosened pattern to be v followed by at least one number, then anything else after (this allows for e.g. "-DRAFT" and "-SNAPSHOT" as a suffix, and shorter version numbers such as "v2")
on:
  workflow_dispatch:

name: Create Release from semantic versioning tag push

permissions:
  contents: write

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build project
        run: ./gradlew --parallel assemble

      - name: Build CLI native image
        run: ./gradlew :tools:cli:nativeCompile
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}

      - name: Build LSP native image
        run: ./gradlew :tools:lsp:nativeCompile
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: true
          prerelease: false

      - name: Upload CLI Distribution
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: tools/cli/build/distributions/jmltk.zip
          asset_name: jmltk-${{ github.ref_name }}.zip
          asset_content_type: application/zip

      - name: Upload CLI Native Image
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: tools/cli/build/native/nativeCompile/jmltk
          asset_name: jmltk-native-linux-${{ github.ref_name }}
          asset_content_type: application/octet-stream

      - name: Upload LSP Native Image
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: tools/lsp/build/native/nativeCompile/jml-lsp
          asset_name: jml-lsp-native-linux-${{ github.ref_name }}
          asset_content_type: application/octet-stream
