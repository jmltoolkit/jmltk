# TinyLog configuration for LSP server
# This configuration avoids logging to stdout to prevent interference with LSP JSON-RPC communication

# Set the minimum logging level
level = info

# Disable console writer (stdout/stderr)
writer.console = disabled

# Enable file writer for logging
writer.file = rolling file
writer.file.level = debug
writer.file.filename = /tmp/lsp-server.log
writer.file.latest = /tmp/lsp-server-latest.log
writer.file.policies = startup, size: 10MB
writer.file.backups = 5
writer.file.format = {date: yyyy-MM-dd HH:mm:ss.SSS} {level} [{thread}] {class}.{method}({file}:{line}) - {message}

# Alternative: If you want to completely disable logging, uncomment the following line:
# level = off
